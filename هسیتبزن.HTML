  <script>

    function plusSlides(n) {
      showSlides(slideIndex += n);

    function showSlides(n) {
      let i;
      let slides = document.getElementsByClassName("slide");
      if (n > slides.length) { slideIndex = 1; }
      if (n < 1) { slideIndex = slides.length; }
      for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
      }
      slides[slideIndex - 1].style.display = "flex";

  <!-- اسکریپت انیمیشن پس‌زمینه: ریسمان‌های نئونی -->
  <script>
    const canvas = document.getElementById('backgroundCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
    
    function randomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 100%, 60%)`;
    }
    
    class Rope {
      constructor() {
        this.reset();
      }
      
      reset() {
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { 
          this.x = Math.random() * canvas.width; 
          this.y = 0; 
        } else if (edge === 1) { 
          this.x = canvas.width; 
          this.y = Math.random() * canvas.height; 
        } else if (edge === 2) { 
          this.x = Math.random() * canvas.width; 
          this.y = canvas.height; 
        } else { 
          this.x = 0; 
          this.y = Math.random() * canvas.height; 
        }
        this.baseAngle = Math.random() * Math.PI * 2;
        this.phase = Math.random() * Math.PI * 2;
        this.phaseSpeed = Math.random() * 0.05 + 0.01;
        this.amplitude = Math.random() * 0.5 + 0.5;
        this.speed = Math.random() * 2 + 1;
        this.lineWidth = Math.random() * 2 + 1;
        this.color = randomColor();
        this.trail = [];
        this.maxTrail = Math.floor(Math.random() * 10) + 5;
      }
      
      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > this.maxTrail) { this.trail.shift(); }
        this.phase += this.phaseSpeed;
        let effectiveAngle = this.baseAngle + this.amplitude * Math.sin(this.phase);
        this.x += Math.cos(effectiveAngle) * this.speed;
        this.y += Math.sin(effectiveAngle) * this.speed;
        if (this.x < -50 || this.x > canvas.width + 50 || this.y < -50 || this.y > canvas.height + 50) { this.reset(); }
      }
      
      draw(ctx) {
        ctx.beginPath();
        if (this.trail.length > 0) {
          ctx.moveTo(this.trail[0].x, this.trail[0].y);
          for (let i = 1; i < this.trail.length; i++) {
            let midX = (this.trail[i - 1].x + this.trail[i].x) / 2;
            let midY = (this.trail[i - 1].y + this.trail[i].y) / 2;
            ctx.quadraticCurveTo(this.trail[i - 1].x, this.trail[i - 1].y, midX, midY);
          }
          ctx.lineTo(this.x, this.y);
        } else {
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(this.x, this.y);
        }
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.lineWidth;
        ctx.stroke();
      }
    }
    
    let ropes = [];
    const numRopes = 30;
    for (let i = 0; i < numRopes; i++) { ropes.push(new Rope()); }
    
    function animateBackground() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ropes.forEach(rope => { rope.update(); rope.draw(ctx); });
      requestAnimationFrame(animateBackground);
    }
    
    animateBackground();
  </script>
